<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>YPCT - Price Compare & Track Logo</title>
  <desc>Minimal logo with a green price tag and teal checkmark, wordmark YPCT, and tagline.</desc>

  <!-- PALETTE -->
  <!-- Tag Green: #10B981 | Teal Check: #14B8A6 | Navy Text: #0F2A45 | Background: #F7FAFC -->

  <!-- FLAT BACKGROUND (delete this rect for a transparent background) -->
  <rect width="1200" height="600" fill="#F7FAFC"/>

  <!-- ICON: Price tag + checkmark -->
  <g transform="translate(160,150)">
    <!-- Price tag shape -->
    <path d="M140 10
             h160
             a20 20 0 0 1 20 20
             v130
             a20 20 0 0 1-6 14
             l-90 90
             a30 30 0 0 1-42 0
             L46 277
             a30 30 0 0 1-9-21
             V30
             a20 20 0 0 1 20-20
             z"
          fill="#10B981"/>

    <!-- Tag hole -->
    <circle cx="290" cy="60" r="10" fill="#F7FAFC"/>

    <!-- Dollar mark (kept as vector text for simplicity) -->
    <text x="200" y="135" text-anchor="middle"
          font-family="Inter, Poppins, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-weight="800" font-size="96" fill="#F7FAFC">$</text>

    <!-- Checkmark -->
    <path d="M40 250
             l60 60
             c6 6 16 6 22 0
             l140-140
             c6-6 6-16 0-22
             l-8-8
             c-6-6-16-6-22 0
             L112 264
             70 222
             c-6-6-16-6-22 0
             l-8 8
             c-6 6-6 16 0 22z"
          fill="#14B8A6"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(520,225)">
    <text x="0" y="0"
          font-family="Inter, Poppins, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-weight="800" font-size="144" fill="#0F2A45" letter-spacing="4">YPCT</text>

    <text x="0" y="90"
          font-family="Inter, Poppins, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="44" fill="#0F2A45" letter-spacing="2">
      PRICE COMPARE &amp; TRACK
    </text>
  </g>
</svg>
