org: davidcher

service: prices-track

provider:
  name: aws
  runtime: nodejs18.x
  region: ${env:REGION}
  stage: ${opt:stage, 'dev'}
  versionFunctions: false
  memorySize: 2048
  environment:
      STAGE: ${opt:STAGE, 'dev'}
      REGION: ${env:REGION}
      BRIGHT_DATA_SERVICE_ENABLED_LIST: ${env:BRIGHT_DATA_SERVICE_ENABLED_LIST}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
        - ec2:CreateNetworkInterface
        - ec2:DescribeNetworkInterfaces
        - ec2:DeleteNetworkInterface
        - lambda:InvokeFunction
        - secretsmanager:GetSecretValue
        - dynamodb:PutItem
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
      Resource: "*"

plugins:
  - serverless-offline
  # - serverless-step-functions
  # - serverless-step-functions-offline
  - serverless-dotenv-plugin

custom:
  PRICE_TRACK_ITEMS_TABLE_NAME: ${env:PRICE_TRACK_ITEMS_TABLE_NAME}-${self:provider.stage}
  S3_RAW_HTML_RESULT_BUCKET_NAME: ${env:S3_RAW_HTML_RESULT_BUCKET_NAME}-${self:provider.stage}
  S3_EXTRACTED_DATA_BUCKET_NAME: ${env:S3_EXTRACTED_DATA_BUCKET_NAME}-${self:provider.stage}
  PRICE_TRACK_SCHEDULED_ITEMS_TABLE_NAME: ${env:PRICE_TRACK_SCHEDULED_ITEMS_TABLE_NAME}-${self:provider.stage}
  PRICE_TRACK_RESULTS_TABLE_NAME: ${env:PRICE_TRACK_RESULTS_TABLE_NAME}-${self:provider.stage}
  secrets:
    brightdataProxyUri: sls-fourth/brightdata/proxy/uri
  serverless-offline:
    httpPort: 5005
    lambdaPort: 5015
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node18
    packager: npm
    separateBuilds: true
    platform: node
    concurrency: 10
    tsconfig: './tsconfig.base.json'
    excludeDevDependencies: true
    # include:
    #   - price-track-machine/handlers/extract-data/**
    #   - price-track-machine/handlers/get-scrape-list/**
    #   - price-track-machine/handlers/scrape-site/**
    #   - price-track-machine/handlers/update-price-track/**
    resolveExtensions:
      - .js
      - .ts
  # stepFunctionsOffline:
  #   stateMachines:
  #     scrapePriceTrackMachine: scrapePriceTrackMachine
  #   port: 4010
  #   GetScrapeList: getScrapeList
  #   ScrapeSite: scrapeSite
  #   ExtractData: extractData
  #   SavePriceTrackData: updateHistoryData


layers:
  chromium:
    path: ../layers/chromium
    name: chromium-layer-${sls:stage}
    compatibleRuntimes:
      - nodejs18.x
    description: Chromium layer for Puppeteer
    package:
      include:
        - nodejs/**

  uuidLib:
    path: ../layers/uuid
    name: uuid-layer-${sls:stage}
    compatibleRuntimes:
      - nodejs18.x
    description: Layer with uuid package
    package:
      include:
        - nodejs/**

  awsStorage:
    path: ../layers/aws-sdk/storage
    name: aws-storage-layer-${sls:stage}
    compatibleRuntimes:
      - nodejs18.x
    description: S3 and DynamoDB layer
    package:
      include:
        - nodejs/**

  awsDataTransfer:
    path: ../layers/aws-sdk/data-transfer
    name: aws-data-transfer-layer-${sls:stage}
    compatibleRuntimes:
      - nodejs18.x
    description: ApiGateWay & SQS layer
    package:
      include:
        - nodejs/**


functions:
  add-price-track-item:
    handler: functions/add-price-track/handler.addPriceTrackItem
    timeout: 300
    layers:
      - { Ref: UuidLibLambdaLayer }
      - { Ref: AwsDataTransferLambdaLayer }
      - { Ref: AwsStorageLambdaLayer }
    environment:
      PRICE_TRACK_SCHEDULED_ITEMS_TABLE_NAME: ${self:custom.PRICE_TRACK_SCHEDULED_ITEMS_TABLE_NAME}
    events:
      - http:
          path: /price-track/add-price-track-item
          method: post
          cors: true

  getScrapeList:
    handler: price-track-machine/handlers/get-scrape-list/handler.getScrapeList
    timeout: 60
    layers:
      - { Ref: AwsStorageLambdaLayer }
    package:
      include:
        - price-track-machine/handlers/get-scrape-list/**

  scrapeSite:
    handler: price-track-machine/handlers/scrape-site/handler.scrapeSite
    timeout: 30
    layers:
      - { Ref: UuidLibLambdaLayer }
      - { Ref: ChromiumLambdaLayer }
    package:
      include:
        - price-track-machine/handlers/scrape-site/**

  # extractData:
  #   handler: price-track-machine/handlers/extract-data/scrapeFromData.handler
  #   timeout: 30

  # updateHistoryData:
  #   handler: price-track-machine/handlers/update-price-track/updateHistoryData.handler
  #   timeout: 30

stepFunctions:
  validate: true
  stateMachines:
    priceTrackMachine:
      name: priceTrackRecord
      loggingConfig:
        level: ALL
        includeExecutionData: true
        destinations:
          - Fn::GetAtt: [ SLSLogGroup, Arn ]
      definition:
        Comment: "Scrape price tracking pipeline state machine"
        StartAt: ScrapeSite
        states:
          ScrapeSite:
            Type: Task
            Resource:
              Fn::GetAtt: [ ScrapeSiteLambdaFunction, Arn ]
            Parameters:
              "scrapeInfo.$": "$.scrapeInfo"
              "userId.$": "$.userId"
            ResultPath: "$.stepScrapeSiteResult"
            TimeoutSeconds: 30
            Next: ExtractData

          # ExtractData:
          #   Type: Task
          #   Resource:
          #     Fn::GetAtt: [ ExtractDataLambdaFunction, Arn ]
          #   InputPath: "$.stepScrapeSiteResult"
          #   ResultPath: "$.stepExtractDataResult"
          #   Next: SavePriceTrackData

          # SavePriceTrackData:
          #   Type: Task
          #   Resource:
          #     Fn::GetAtt: [ UpdateHistoryDataLambdaFunction, Arn ]
          #   InputPath: "$.stepExtractDataResult"
          #   ResultPath: "$.stepSavePriceTrackData"
          #   End: true

      End: true

    scrapePriceTrackMachine:
      name: priceTrackRecord
      loggingConfig:
        level: ALL
        includeExecutionData: true
        destinations:
          - Fn::GetAtt: [ SLSLogGroup, Arn ]
      definition:
        Comment: "Scrape price tracking pipeline state machine"
        StartAt: GetScrapeList
        States:
          GetScrapeList:
            Type: Task
            Resource:
              Fn::GetAtt: [ GetScrapeListLambdaFunction, Arn ]
            ResultPath: "$.stepGetScrapeListResult"
            Next: iterateScrapeList

          iterateScrapeList:
            Type: Map
            ItemsPath: "$.stepGetScrapeListResult.scrapeList"
            Parameters:
              "scrapeInfo.$": "$$.Map.Item.Value"
              # "userId.$": "$.stepGetScrapeListResult.userId"
            MaxConcurrency: 5
            Iterator:
              StartAt: ScrapeSite
              States:

                ScrapeSite:
                  Type: Task
                  Resource:
                    Fn::GetAtt: [ ScrapeSiteLambdaFunction, Arn ]
                  Parameters:
                    "scrapeInfo.$": "$.scrapeInfo"
                    "userId.$": "$.userId"
                  ResultPath: "$.stepScrapeSiteResult"
                  TimeoutSeconds: 30
                  Next: ExtractData

                ExtractData:
                  Type: Task
                  Resource:
                    Fn::GetAtt: [ ExtractDataLambdaFunction, Arn ]
                  InputPath: "$.stepScrapeSiteResult"
                  ResultPath: "$.stepExtractDataResult"
                  Next: SavePriceTrackData

                SavePriceTrackData:
                  Type: Task
                  Resource:
                    Fn::GetAtt: [ UpdateHistoryDataLambdaFunction, Arn ]
                  InputPath: "$.stepExtractDataResult"
                  ResultPath: "$.stepSavePriceTrackData"
                  End: true

package:
  individually: true

