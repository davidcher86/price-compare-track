# "service" is the name of this project. This will also be added to your AWS resource names.
org: davidcher

service: sls-user-details

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  memorySize: 1024
  timeout: 60
  region: eu-central-1
  stage: ${env:PROFILE, 'dev'}
  environment:
    SERVERLESS_ACCESS_KEY: ${env:SERVERLESS_ACCESS_KEY}
    REGION: ${self:provider.region}
    USER_DETAILS_TABLE: user-details
  iamRoleStatements:
    - Effect: Allow
      Action:
        - "logs:CreateLogGroup"
        - "logs:CreateLogStream"
        - "logs:PutLogEvents"
        - "s3:GetObject"
        - "lambda:InvokeFunction"
        - "dynamodb:Query"
        - "dynamodb:GetItem"
        - "dynamodb:PutItem"
        - "dynamodb:DeleteItem"
      Resource: "*"

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  # WS_CONNECTIONS_TABLE_NAME: ${env:WS_CONNECTIONS_TABLE_NAME}-${self:provider.stage}
  WS_CONNECTIONS_TABLE_NAME: ${env:WS_CONNECTIONS_TABLE_NAME}-prod
  RESULT_DB_TABLE_NAME: ${env:RESULT_DB_TABLE_NAME}-prod
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node18
    packager: npm
    exclude: ['aws-sdk']
    separateBuilds: true
    platform: node
    concurrency: 10
    tsconfig: './tsconfig.base.json'
    excludeDevDependencies: true
  serverless-offline:
    httpPort: 4002
    websocketPort: 4001
    lambdaPort: 4010

layers:
  uuidLib:
    path: ../layers/uuid
    name: uuid-layer-${sls:stage}
    compatibleRuntimes:
      - nodejs18.x
    description: Layer with uuid package
    package:
      include:
        - nodejs/**

  awsStorage:
    path: ../layers/aws-sdk/storage
    name: aws-storage-layer-${sls:stage}
    compatibleRuntimes:
      - nodejs18.x
    description: S3 and DynamoDB layer
    package:
      include:
        - nodejs/**

  awsDataTransfer:
    path: ../layers/aws-sdk/data-transfer
    name: aws-data-transfer-layer-${sls:stage}
    compatibleRuntimes:
      - nodejs18.x
    description: ApiGateWay & SQS layer
    package:
      include:
        - nodejs/**

functions:
  # add-user:
  #   architecture: x86_64
  #   handler: functions/add-user/handler.addUserDetails
  #   layers:
  #     - { Ref: AwsStorageLambdaLayer }
  #   package:
  #     include:
  #       - functions/add-user/**
  #   events:
  #     - http:
  #         path: /new-user-details
  #         method: post

  # update-user:
  #   architecture: x86_64
  #   handler: functions/update-user/handler.editUserDetails
  #   layers:
  #     - { Ref: AwsStorageLambdaLayer }
  #   package:
  #     include:
  #       - functions/update-user/**
  #   events:
  #     - http:
  #         path: /update-user-details
  #         method: put

  # get-user:
  #   architecture: x86_64
  #   handler: functions/get-user/handler.getUserDetails
  #   layers:
  #     - { Ref: AwsStorageLambdaLayer }
  #   package:
  #     include:
  #       - functions/get-user/**
  #   events:
  #     - http:
  #         path: /get-user-details
  #         method: get

  get-scrape-data-result:
    architecture: x86_64
    handler: functions/get-scrape-result/handler.getScrapeData
    timeout: 29
    environment:
      RESULT_DB_TABLE_NAME: ${self:custom.RESULT_DB_TABLE_NAME}
    layers:
      - { Ref: AwsStorageLambdaLayer }
    package:
      individually: true
      include:
        - functions/get-scrape-results/**
        - commons/**
    events:
      - http:
          path: /user-details/scrape-data-result
          method: post

  delete-user-scrape:
    architecture: x86_64
    handler: functions/delete-user-scrape/handler.deleteScrape
    timeout: 29
    environment:
      RESULT_DB_TABLE_NAME: ${self:custom.RESULT_DB_TABLE_NAME}
    layers:
      - { Ref: AwsStorageLambdaLayer }
    package:
      individually: true
      include:
        - functions/delete-user-scrape/**
        - commons/**
    events:
      - http:
          path: /user-details/scrape
          method: delete

  get-user-scrape-history:
    architecture: x86_64
    handler: functions/get-user-scrapes/handler.getScrapeResultData
    timeout: 29
    environment:
      RESULT_DB_TABLE_NAME: ${self:custom.RESULT_DB_TABLE_NAME}
    layers:
      - { Ref: AwsStorageLambdaLayer }
    package:
      individually: true
      include:
        - functions/get-user-scrapes/**
        - commons/**
    events:
      - http:
          path: /user-details/scrape-history
          method: get

  connect:
    handler: websocket/functions/connect.handler
    package:
      include:
        - websocket/**
        - commons/**
    events:
      - websocket:
          route: $connect
    environment:
      WS_CONNECTIONS_TABLE_NAME: ${self:custom.WS_CONNECTIONS_TABLE_NAME}

  disconnect:
    handler: websocket/functions/disconnect.handler
    package:
      include:
        - websocket/**
        - commons/**
    events:
      - websocket:
          route: $disconnect
    environment:
      WS_CONNECTIONS_TABLE_NAME: ${self:custom.WS_CONNECTIONS_TABLE_NAME}

  default:
    handler: websocket/functions/default.handler
    package:
      include:
        - websocket/**
        - commons/**
    events:
      - websocket:
          route: $default

  notifyClient:
    handler: websocket/functions/notifyClient.handler
    package:
      include:
        - websocket/**
        - commons/**
    environment:
      STAGE: ${self:provider.stage}
      LOCAL_PORT: ${env:LOCAL_PORT}
      WS_CONNECTIONS_TABLE_NAME: ${self:custom.WS_CONNECTIONS_TABLE_NAME}
      WS_CONNECTIONS_DOMAIN: ${env:WS_CONNECTIONS_DOMAIN}

  sendMessage:
    handler: websocket/functions/sendMessage.handler
    package:
      include:
        - websocket/**
        - commons/**
    timeout: 29
    events:
      - http:
          path: send
          method: post