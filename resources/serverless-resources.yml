org: davidcher
service: price-compare-tracker-resources

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs18.x
  memorySize: 2048
  timeout: 60
  stage: ${opt:stage, 'dev'}
  region: ${env:REGION}
  versionFunctions: false
  environment:
    STAGE: ${opt:STAGE, 'dev'}
    REGION: ${env:REGION}

plugins:
  - serverless-dotenv-plugin

custom:
  WS_CONNECTIONS_TABLE_NAME: ${env:WS_CONNECTIONS_TABLE_NAME}-${self:provider.stage}
  RESULT_DB_TABLE_NAME: ${env:RESULT_DB_TABLE_NAME}-${self:provider.stage}
  S3_RAW_HTML_RESULT_BUCKET_NAME: ${env:S3_RAW_HTML_RESULT_BUCKET_NAME}-${self:provider.stage}
  S3_EXTRACTED_DATA_BUCKET_NAME: ${env:S3_EXTRACTED_DATA_BUCKET_NAME}-${self:provider.stage}
  PRICE_TRACK_SCHEDULED_ITEMS_TABLE_NAME: ${env:PRICE_TRACK_SCHEDULED_ITEMS_TABLE_NAME}-${self:provider.stage}
  PRICE_TRACK_RESULTS_TABLE_NAME: ${env:PRICE_TRACK_RESULTS_TABLE_NAME}-${self:provider.stage}
  S3_FAILED_EXTRACTED_DATA_BUCKET_NAME: ${env:S3_FAILED_EXTRACTED_DATA_BUCKET_NAME}-${self:provider.stage}

resources:
  Resources:
    ScrapedHtmlBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.S3_RAW_HTML_RESULT_BUCKET_NAME}
      DeletionPolicy: Retain

    ExtractedDataBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.S3_EXTRACTED_DATA_BUCKET_NAME}
      DeletionPolicy: Retain

    FailedExtractDataBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.S3_FAILED_EXTRACTED_DATA_BUCKET_NAME}
      DeletionPolicy: Retain

    ReactAppBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        BucketName: ${env:S3_REACT_APP_BUCKET_NAME}-prod-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html

    ReactAppBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ReactAppBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Join ['', ['arn:aws:s3:::', !Ref ReactAppBucket, '/*']]

    PriceTrackScheduledScrapesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:custom.PRICE_TRACK_SCHEDULED_ITEMS_TABLE_NAME}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: enabled
            AttributeType: S
          - AttributeName: createdDt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: user-id-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdDt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: user-enabled-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: enabled
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

      
    WsScrapeStatusConnectionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:custom.WS_CONNECTIONS_TABLE_NAME}
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: user-id-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    UserScrapesResultsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: user-scrape-results-${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: scrapeId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: scrapeRequestId
            AttributeType: S
          - AttributeName: scrapeDate
            AttributeType: S
        KeySchema:
          - AttributeName: scrapeId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: user-id-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: scrapeDate
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: scrape-request-id-index
            KeySchema:
              - AttributeName: scrapeRequestId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    PriceTrackResultsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:custom.PRICE_TRACK_RESULTS_TABLE_NAME}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: scrapeDate
            AttributeType: S
          - AttributeName: scrapeCode
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: user-id-scrape-date-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: scrapeDate
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: scrape-code-index
            KeySchema:
              - AttributeName: scrapeCode
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

  Outputs:
    ReactClientAppBucketName:
      Value: !Ref ReactAppBucket
      Export:
        Name: ReactAppBucketName

    ReactClientAppBucketDomainName:
      Value: !GetAtt ReactAppBucket.RegionalDomainName
      Export:
        Name: ReactAppBucketDomainName